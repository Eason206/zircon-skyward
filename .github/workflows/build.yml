name: Build and verify

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  tag:
    name: Match the release tag to the binary version
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check version
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          test "$GITHUB_REF_NAME" = "v$version"

  check:
    name: Tests and lints
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Native workspace lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Workspace tests
        run: cargo test --locked --workspace
      - name: Android workspace lint
        run: cargo ndk -t arm64-v8a --platform 30 clippy --locked --workspace --all-targets -- -D warnings
      - name: Check helper syntax and configuration
        run: |
          bash -n scripts/env.sh scripts/setup-env.sh scripts/build-zircon.sh
          python3 - <<'PY'
          import ast, json, tomllib
          from pathlib import Path
          ast.parse(Path("scripts/verify-zircon.py").read_text())
          config = tomllib.loads(Path("devices/zircon.toml").read_text())
          stock = json.loads(Path("devices/zircon-stock.json").read_text())
          assert config["stock"]["version"] == stock["version"]
          assert config["stock"]["recovery"] == stock["vendor_boot"]["sha256"]
          PY

  tools:
    name: Build ARM64 recovery and host packer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Android recovery
        run: cargo ndk -t arm64-v8a --platform 30 build --locked --release -p skyward
      - name: Static system-init
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo ndk -t arm64-v8a --platform 30 build --locked --release -p skyward-system-init --target-dir target/system-init
      - name: Host packer
        run: cargo build --locked --release -p skyward-pack
      - name: Collect build tools
        run: |
          mkdir -p artifacts/tools
          cp target/aarch64-linux-android/release/skyward target/release/skyward-pack artifacts/tools/
          cp target/system-init/aarch64-linux-android/release/system-init artifacts/tools/
      - uses: actions/upload-artifact@v7
        with:
          name: zircon-recovery-tools
          path: artifacts/tools/
          if-no-files-found: error
          retention-days: 7

# Full image packing uses local, hash-pinned stock inputs. A verified local
# build is attached to a release; CI never substitutes a pearl image for it.
